<!DOCTYPE html>
<html lang="en" data-theme="dark" data-surface="admin">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <!-- Before first paint: the stored theme (dark by default) goes on <html> so there is never a
         flash of the wrong one. -->
    <script src="../../assets/js/theme-boot.js"></script>
    <title>Section — PIA System</title>

    <script src="../../assets/js/page-guard.js"></script>
    <script src="/assets/js/vendor/supabase.js"></script>
    <script src="../../assets/js/admin-fonts.js"></script>

    <!-- The homepage look: the same tokens and components as the admin console, and the same
         wallpaper, so the two feel like one product. This page only READS. -->
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages/admin.css">
    <link rel="stylesheet" href="../../styles/pages/admin-console.css">
    <link rel="stylesheet" href="../../styles/pages/admin-pia.css?v=20261029a">
    <link rel="stylesheet" href="../../styles/pages/teacher-class.css?v=20261029b">
</head>

<body data-boot="pending">

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></symbol>
            <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2Z"/></symbol>
            <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9.5 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4.5"/><path d="m16 16.5 4.5-4.5L16 7.5"/><path d="M20.5 12H9"/></symbol>
        </defs>
    </svg>

    <!-- Shown while the access check runs, and again (with a retry) if the server cannot be reached. -->
    <div class="t-boot" id="boot" role="status" aria-live="polite">
        <p id="boot-text">Checking your access…</p>
        <button class="btn btn-primary" id="boot-retry" type="button" hidden>Try again</button>
    </div>

    <div class="t-app" id="app" hidden>

        <header class="t-bar">
            <a class="t-brand" href="#main" aria-label="PIA, back to the class">
                <img class="site-logo" src="../../assets/images/logo-320.webp" alt="PIA">
            </a>
            <div class="t-bar-right">
                <button type="button" class="btn-icon theme-toggle" id="theme-toggle" aria-label="Switch to light theme">
                    <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
                    <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
                </button>
                <span class="t-who" id="who"></span>
                <button type="button" class="btn btn-secondary btn-sm" id="signout">
                    <svg class="icon" aria-hidden="true"><use href="#i-logout"></use></svg>
                    Sign out
                </button>
            </div>
        </header>

        <main class="t-main" id="main">
            <div class="page-head">
                <div class="t-title">
                    <h1 class="page-title" id="section-title">Your section</h1>
                    <select class="input input-sm" id="section-switch" aria-label="Switch section" hidden></select>
                </div>
                <div class="head-search" role="search">
                    <label class="sr-only" for="find">Search students</label>
                    <input type="search" class="input" id="find" placeholder="Search by name">
                </div>
            </div>

            <div class="scope-row">
                <p class="scope-line" id="scope-line" aria-live="polite">Loading…</p>
                <label class="show-details">
                    <input type="checkbox" id="show-names" checked> Show names
                </label>
            </div>

            <p class="t-empty-section" id="no-section" hidden>
                You are not assigned to a section yet. Ask the administrator to assign you one.
            </p>

            <div class="panel" id="roster-panel">
                <div class="panel-bar">
                    <div class="tabs" role="group" aria-label="Filter the roster" id="filters">
                        <button type="button" class="tab is-active" data-filter="all" aria-pressed="true">All <span class="mono" data-count="all">—</span></button>
                        <button type="button" class="tab" data-filter="online" aria-pressed="false">Online <span class="mono" data-count="online">—</span></button>
                        <button type="button" class="tab" data-filter="setting_up" aria-pressed="false">Setting up <span class="mono" data-count="setting_up">—</span></button>
                        <button type="button" class="tab" data-filter="waiting" aria-pressed="false">Waiting <span class="mono" data-count="waiting">—</span></button>
                        <button type="button" class="tab" data-filter="tutoring" aria-pressed="false">Tutoring <span class="mono" data-count="tutoring">—</span></button>
                    </div>
                </div>

                <div class="table-wrap" tabindex="0" role="region" aria-label="Students">
                    <table class="table">
                        <caption class="sr-only">Students in your section</caption>
                        <thead>
                            <tr>
                                <th scope="col">Student</th>
                                <th scope="col">Status</th>
                                <th scope="col">Stage</th>
                                <th scope="col">Attendance</th>
                            </tr>
                        </thead>
                        <tbody id="roster"></tbody>
                    </table>
                    <div class="state-block is-hidden" id="roster-empty">
                        <p class="state-title" id="roster-empty-text">No matching students</p>
                    </div>
                </div>

                <p class="panel-foot muted" id="foot">Read-only. This page changes nothing.</p>
            </div>
        </main>
    </div>

    <script src="../../assets/js/function.js?v=20261029c"></script>
    <script src="../js/teacher-class.js?v=20261029a"></script>
</body>

</html>
