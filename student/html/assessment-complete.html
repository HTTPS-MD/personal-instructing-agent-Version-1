<!DOCTYPE html>
<html lang="en" data-theme="dark" data-surface="comic">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <!-- Before first paint: the stored theme (dark by default) goes on
         <html> so there is never a flash of the wrong one. -->
    <script src="../../assets/js/theme-boot.js"></script>
    <title>Thank You — PIA</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages/student-journey.css">
</head>

<!-- Where a student lands the moment the questionnaire is submitted.

     Deliberately says nothing about the result: no score, no trait, no
     tutor. There is nothing here to leak even by accident — the results are
     stored only where an admin can read them (migration 0018), and the
     submission itself returns no score to the browser.

     assessment-complete.js removes `opacity-0` once the session is verified
     and the questionnaire is confirmed done. -->
<body class="opacity-0">

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="m14 6 6 6-6 6"/></symbol>
        </defs>
    </svg>

    <div class="journey">
        <div class="journey-ambient" aria-hidden="true"></div>

        <header class="journey-bar">
            <div class="journey-shell journey-bar-inner">
                <div class="journey-brand">
                    <a class="brand-link" href="../../index.html"><img class="site-logo" src="../../assets/images/logo.svg" alt="PIA home" width="48" height="48"></a>
                    <div class="stage-rail hide-sm" aria-label="Your progress through the study">
                        <span class="stage-node is-done"><span class="pip"></span>Waiting</span>
                        <span class="stage-sep"></span>
                        <span class="stage-node is-done"><span class="pip"></span>Test</span>
                        <span class="stage-sep"></span>
                        <span class="stage-node"><span class="pip"></span>Tutor</span>
                        <span class="stage-sep"></span>
                        <span class="stage-node"><span class="pip"></span>Practice</span>
                    </div>
                </div>

                <div class="journey-bar-right">
                    <button class="btn btn-signout" id="signout-btn" data-signout>
                        Sign out
                    </button>
                </div>
            </div>
        </header>

        <main class="journey-main">
            <div class="journey-shell">
                <section class="gate-wrap gate-open" aria-labelledby="done-title">
                    <h1 class="gate-title" id="done-title">Thank you for completing the assessment</h1>
                    <p class="gate-lede">
                        Your answers have been saved. There is nothing else you need to do here.
                    </p>

                    <!-- The waiting room is the safe default; the script points
                         this at the student's actual next step once it knows it. -->
                    <div class="gate-actions">
                        <a href="waiting-room.html" class="btn btn-primary btn-block" id="btn-continue">
                            Continue
                            <svg class="icon"><use href="#i-arrow-right"></use></svg>
                        </a>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="../../assets/js/function.js"></script>
    <script src="../js/assessment-complete.js"></script>
</body>

</html>
