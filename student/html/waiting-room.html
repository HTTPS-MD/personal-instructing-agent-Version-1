<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ROUTE GUARD (stage 1 of 2): cheap fail-fast lang ito, HINDI security.
         Ang tunay na verification ay ang enforceStudentStage() sa page JS, na
         tumutugma sa totoong Supabase Auth session. Nakatago ang body
         (opacity-0) hangga't hindi pa kumpirmado ang session. -->
    <script>
        (function () {
            var hasToken = false;
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    if (/^sb-.*-auth-token$/.test(localStorage.key(i))) { hasToken = true; break; }
                }
            } catch (e) { /* storage blocked -- hayaan ang async guard ang bahala */ }
            if (!hasToken) window.location.replace('../../index.html');
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../styles/tokens.css">
    <link rel="stylesheet" href="../../styles/base.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="../../styles/pages/student.css">
    <title>Waiting Room - PIA System</title>
</head>

<body class="waiting-page opacity-0">

    <div class="waiting-split">

        <div class="waiting-illustration">
            <img src="/assets/images/ocean.png" alt="Waiting Illustration" class="waiting-bg">
            <div class="waiting-gradient"></div>
        </div>

        <div class="waiting-content">
            <div class="waiting-inner">

                <div class="waiting-spinner-box">
                    <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>

                <div class="waiting-text-block">
                    <h1 id="waiting-title" class="waiting-title">Waiting for Instructor</h1>
                    <p id="waiting-desc" class="text-secondary waiting-desc">
                        The next session is currently closed. You will be automatically redirected the moment your
                        instructor opens it. Please stay on this page.
                    </p>
                </div>

                <div class="waiting-actions">
                    <a href="../../index.html" class="btn btn-secondary btn-lg btn-block">Back to Homepage</a>
                </div>

            </div>
        </div>

    </div>

    <script src="../../assets/js/function.js"></script>
    <script src="../js/waiting-room.js"></script>
</body>

</html>
