<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <!-- Before first paint: the stored theme (dark by default) goes on
         <html> so there is never a flash of the wrong one. -->
    <script src="../../assets/js/theme-boot.js"></script>
    <title>Waiting Room — PIA</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages/student-journey.css">
</head>

<!-- requireStudentSession() removes `opacity-0` once the session is verified. -->
<body class="opacity-0">

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.4V12l3.1 1.9"/></symbol>
            <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".9" fill="currentColor" stroke="none"/></symbol>
            <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9.5 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4.5"/><path d="m16 16.5 4.5-4.5L16 7.5"/><path d="M20.5 12H9"/></symbol>
        </defs>
    </svg>

    <div class="journey">
        <div class="journey-ambient" aria-hidden="true"></div>

        <header class="journey-bar">
            <div class="journey-shell journey-bar-inner">
                <div class="journey-brand">
                    <a class="brand-link" href="../../index.html"><img class="site-logo" src="../../assets/images/logo.svg" alt="PIA home" width="48" height="48"></a>
                    <!-- Four stages, always visible, so a waiting student can see
                         both where they are and what is still to come. -->
                    <div class="stage-rail hide-sm" aria-label="Your progress through the study">
                        <span class="stage-node is-current"><span class="pip"></span>Waiting</span>
                        <span class="stage-sep"></span>
                        <span class="stage-node"><span class="pip"></span>Test</span>
                        <span class="stage-sep"></span>
                        <span class="stage-node"><span class="pip"></span>Tutor</span>
                        <span class="stage-sep"></span>
                        <span class="stage-node"><span class="pip"></span>Practice</span>
                    </div>
                </div>

                <div class="journey-bar-right">
                    <button class="btn btn-secondary" id="signout-btn" data-signout>
                        <svg class="icon"><use href="#i-logout"></use></svg>
                        Sign out
                    </button>
                </div>
            </div>
        </header>

        <main class="journey-main">
            <div class="journey-shell">
                <div class="wait-card">
                    <div class="wait-orb" aria-hidden="true">
                        <svg class="icon"><use href="#i-clock"></use></svg>
                    </div>

                    <!-- waiting-room.js swaps both of these between three stage
                         variants. Their heights are reserved in the stylesheet
                         so the note and button below never move. -->
                    <h1 class="wait-title" id="waiting-title">Waiting for your teacher</h1>
                    <p class="wait-desc" id="waiting-desc">
                        This stage isn't open yet. Keep this page open — it will move you
                        forward automatically the moment your teacher starts it.
                    </p>

                    <div class="wait-note">
                        <svg class="icon"><use href="#i-info"></use></svg>
                        <p>You don't need to refresh or do anything. If you close this page,
                            just sign in again and you'll come right back here.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../assets/js/function.js"></script>
    <script src="../js/waiting-room.js"></script>
</body>

</html>
