<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <!-- Before first paint: the stored theme (dark by default) goes on
         <html> so there is never a flash of the wrong one. -->
    <script src="../../assets/js/theme-boot.js"></script>
    <title>Choose a New Password — PIA</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@700&display=swap">

    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages/student-journey.css">
</head>

<!-- The forced password change. A student whose temporary password was set by
     an admin is sent here at sign-in, and requireStudentSession() sends every
     other student page back here, until they choose a password only they know.

     Deliberately no navigation: the header carries only Sign out, and the
     stage rail is non-interactive. set-new-password.js removes `opacity-0`
     once the session is verified and the account is confirmed flagged. -->
<body class="opacity-0">

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-key" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10.2" rx="2.5"/><path d="M7.8 10V7.6a4.2 4.2 0 0 1 8.4 0V10"/><circle cx="12" cy="15.2" r="1.2" fill="currentColor" stroke="none"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
            <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.2 2.8 20h18.4L12 4.2Z"/><path d="M12 10.5v3.8"/><circle cx="12" cy="17.2" r=".9" fill="currentColor" stroke="none"/></symbol>
            <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></symbol>
            <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9.5 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4.5"/><path d="m16 16.5 4.5-4.5L16 7.5"/><path d="M20.5 12H9"/></symbol>
        </defs>
    </svg>

    <div class="journey">
        <div class="journey-ambient" aria-hidden="true"></div>

        <header class="journey-bar">
            <div class="journey-shell journey-bar-inner">
                <div class="journey-brand">
                    <span class="journey-mark" aria-hidden="true">PIA</span>
                </div>

                <div class="journey-bar-right">
                    <button class="btn btn-secondary" id="signout-btn" data-signout>
                        <svg class="icon"><use href="#i-logout"></use></svg>
                        Sign out
                    </button>
                </div>
            </div>
        </header>

        <main class="journey-main">
            <div class="journey-shell">
                <div class="gate-wrap">
                    <div class="gate-glyph">
                        <svg class="icon icon-lg"><use href="#i-key"></use></svg>
                    </div>

                    <h1 class="gate-title">Choose a new password</h1>
                    <p class="gate-lede">
                        You signed in with a temporary password. Replace it with one that only you
                        know — you'll use it every time you sign in from now on.
                    </p>

                    <p class="pw-identity">Signed in as <b id="pw-email">—</b></p>

                    <form id="new-password-form" class="pw-form" novalidate>
                        <!-- A hidden username field lets password managers file
                             the new password against the right account. -->
                        <input type="email" id="pw-username" autocomplete="username" hidden>

                        <div class="field">
                            <label class="label" for="pw-new">New password</label>
                            <input class="input" type="password" id="pw-new" autocomplete="new-password"
                                aria-describedby="pw-rules pw-new-msg" maxlength="72">
                            <p class="field-msg" id="pw-new-msg" data-msg-for="pw-new"></p>
                        </div>

                        <div class="field">
                            <label class="label" for="pw-confirm">Confirm new password</label>
                            <input class="input" type="password" id="pw-confirm" autocomplete="new-password"
                                aria-describedby="pw-confirm-msg" maxlength="72">
                            <p class="field-msg" id="pw-confirm-msg" data-msg-for="pw-confirm"></p>
                        </div>

                        <!-- Live checklist. Each rule ticks as it is met; the list
                             is described by the field, so a screen reader hears
                             the rules when the field takes focus. -->
                        <ul class="pw-rules" id="pw-rules" aria-label="Password requirements">
                            <li data-rule="length"><svg class="icon"><use href="#i-dot"></use></svg>At least 8 characters</li>
                            <li data-rule="letter"><svg class="icon"><use href="#i-dot"></use></svg>At least one letter</li>
                            <li data-rule="number"><svg class="icon"><use href="#i-dot"></use></svg>At least one number</li>
                            <li data-rule="match"><svg class="icon"><use href="#i-dot"></use></svg>Both passwords match</li>
                        </ul>

                        <label class="pw-show">
                            <input type="checkbox" id="pw-show-toggle">
                            Show passwords
                        </label>

                        <div class="gate-actions">
                            <button class="btn btn-primary btn-block" type="submit" id="pw-submit">
                                Save new password
                            </button>
                        </div>
                    </form>

                    <p class="pw-status" id="pw-status" role="status" aria-live="polite"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="../../assets/js/function.js"></script>
    <script src="../js/set-new-password.js"></script>
</body>

</html>
