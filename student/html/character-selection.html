<!DOCTYPE html>
<html lang="en" data-theme="dark" data-surface="comic">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <!-- Before first paint: the stored theme (dark by default) goes on
         <html> so there is never a flash of the wrong one. -->
    <script src="../../assets/js/theme-boot.js"></script>
    <title>PIA</title>

    <script src="/assets/js/vendor/supabase.js"></script>


    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages/student-journey.css">
    <link rel="stylesheet" href="../../styles/pages/student-paper.css">
</head>

<!-- enforceStudentStage('char') removes `opacity-0` once the whole
     prerequisite chain has passed on the server. -->
<body class="opacity-0 paper">

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        </defs>
    </svg>

    <div class="journey">
        <div class="journey-ambient journey-ambient--classroom" aria-hidden="true"></div>

        <header class="journey-bar">
            <div class="journey-shell journey-bar-inner">
                <div class="journey-brand">
                    <span class="brand-link"><img class="site-logo" src="../../assets/images/logo.svg" alt="PIA" width="48" height="48"></span>
                </div>

                <div class="journey-bar-right">
                    <button class="btn btn-signout" id="signout-btn" data-signout data-no-who>Quit</button>
                    <button type="button" class="btn btn-signout btn-theme" id="theme-toggle" aria-label="Switch to light theme">
                        <svg class="theme-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
                        <svg class="theme-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="journey-main">
            <div class="journey-shell">
                <!-- The tutors who are not picked are boxes on the left; the picked one stands in the room on the right,
                     says a line, and can be tapped to change expression (the same as the landing page). -->
                <div class="pick-scene" id="pick-scene">
                    <div class="persona-grid pick-head" role="group" aria-label="Tutors">
                        <button type="button" class="persona-card" aria-pressed="false"
                            data-character="pia-open"
                            data-name="Ava"
                            data-lines="Hi, I’m Ava! I like to ask “why” before we do the “how”.|Stuck on a rule? Let’s find out where it came from!|Great thinking! Shall we explore the next one together?"
                            data-poses="../../assets/images/personas/Openness/default.webp ../../assets/images/personas/Openness/happy.webp ../../assets/images/personas/Openness/excited.webp"
                            data-fallback-img="../../assets/images/tutors/pia-open/default.webp">
                            <span class="persona-thumb"><img src="../../assets/images/heads/pia-open.webp" alt="" width="52" height="52"></span>
                            <span class="persona-text"><span class="persona-name">Ava</span><span class="persona-tag">Finds the why</span></span>
                        </button>
                        <button type="button" class="persona-card" aria-pressed="false"
                            data-character="pia-conscientious"
                            data-name="Cara"
                            data-lines="Hi, I’m Cara! I check every step, so nothing gets missed.|Same order, every time. Let’s go through it together!"
                            data-poses="../../assets/images/personas/Conscientiousness/happy.webp ../../assets/images/personas/Conscientiousness/excited.webp"
                            data-fallback-img="../../assets/images/tutors/pia-conscientious/default.webp">
                            <span class="persona-thumb"><img src="../../assets/images/heads/pia-conscientious.webp" alt="" width="52" height="52"></span>
                            <span class="persona-text"><span class="persona-name">Cara</span><span class="persona-tag">Every detail</span></span>
                        </button>
                        <button type="button" class="persona-card" aria-pressed="false"
                            data-character="pia-extravert"
                            data-name="Theo"
                            data-lines="Hey, I’m Theo! Let’s make maths quick and fun!|Short questions, fast turns. You’ve got this!|Woohoo! Ready for the next one?"
                            data-poses="../../assets/images/personas/Extraverted/default.webp ../../assets/images/personas/Extraverted/happy.webp ../../assets/images/personas/Extraverted/excited.webp"
                            data-fallback-img="../../assets/images/tutors/pia-extravert/default.webp">
                            <span class="persona-thumb"><img src="../../assets/images/heads/pia-extravert.webp" alt="" width="52" height="52"></span>
                            <span class="persona-text"><span class="persona-name">Theo</span><span class="persona-tag">High energy</span></span>
                        </button>
                        <button type="button" class="persona-card" aria-pressed="false"
                            data-character="pia-agreeable"
                            data-name="Amy"
                            data-lines="Hi, I’m Amy! I’ll ask how it’s going, and I really mean it.|Take your time. I’m right here with you.|You did it! Let’s keep going together!"
                            data-poses="../../assets/images/personas/Agreeableness/default.webp ../../assets/images/personas/Agreeableness/happy.webp ../../assets/images/personas/Agreeableness/excited.webp"
                            data-fallback-img="../../assets/images/tutors/pia-agreeable/default.webp">
                            <span class="persona-thumb"><img src="../../assets/images/heads/pia-agreeable.webp" alt="" width="52" height="52"></span>
                            <span class="persona-text"><span class="persona-name">Amy</span><span class="persona-tag">Endless patience</span></span>
                        </button>
                        <button type="button" class="persona-card" aria-pressed="false"
                            data-character="pia-calm"
                            data-name="Kai"
                            data-lines="Hi, I’m Kai! Let’s check each step together.|Slow and steady. Let’s make sure it’s right!"
                            data-poses="../../assets/images/personas/Neuroticism/happy.webp ../../assets/images/personas/Neuroticism/excited.webp"
                            data-fallback-img="../../assets/images/tutors/pia-calm/default.webp">
                            <span class="persona-thumb"><img src="../../assets/images/heads/pia-calm.webp" alt="" width="52" height="52"></span>
                            <span class="persona-text"><span class="persona-name">Kai</span><span class="persona-tag">Checks every step</span></span>
                        </button>
                        <button type="button" class="persona-card" aria-pressed="false"
                            data-character="pia-neutral"
                            data-name="Noel"
                            data-lines="Hello, I’m Noel. Clear, straightforward guidance.|Here’s the next step. Ready when you are."
                            data-poses="../../assets/images/personas/Neutral/default.webp ../../assets/images/personas/Neutral/approval.webp"
                            data-fallback-img="../../assets/images/tutors/pia-neutral/approval.webp">
                            <span class="persona-thumb"><img src="../../assets/images/heads/pia-neutral.webp" alt="" width="52" height="52"></span>
                            <span class="persona-text"><span class="persona-name">Noel</span><span class="persona-tag">Straightforward guidance</span></span>
                        </button>
                    </div>

                    <section class="pick-stage" id="preview-card" aria-live="polite">
                        <p class="pick-hello" id="pick-hello"><span class="pick-arrow" aria-hidden="true">◀</span> Tap a tutor to say hi!</p>

                        <div class="pick-bubble" id="pick-bubble" hidden>
                            <b id="preview-name"></b>
                            <span id="preview-desc"></span>
                        </div>

                        <span class="pick-spot" aria-hidden="true"></span>
                        <button type="button" class="pick-big" id="pick-big" aria-label="Tap to hear more" hidden>
                            <img id="preview-bg-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
                        </button>

                        <div class="pick-act">
                            <button class="btn btn-primary" id="lock-in-btn" data-action="confirm" disabled hidden>Choose</button>
                            <button class="btn btn-primary" id="continue-btn" data-action="continue" style="display:none">Continue</button>
                            <p class="pick-status" id="status-text" role="status"></p>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <!-- =============================================== MODAL · CONFIRM ---
         One safe dismiss action in the footer; Escape has the same effect.
         The controller toggles `modal-active` / `modal-content-active`. -->
    <div class="overlay" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-heading">
        <div class="modal modal-sm" id="modal-content">
            <header class="modal-head">
                <div class="modal-head-text">
                    <h2 class="modal-title" id="confirm-heading">Lock in your tutor?</h2>
                    <p class="modal-sub">You keep this tutor for the whole study.</p>
                </div>
            </header>

            <div class="modal-body">
                <p class="modal-text">
                    This choice is final. You won't be able to swap tutors later, so pick the one
                    whose style sounds best for how you like to learn.
                </p>
            </div>

            <footer class="modal-foot">
                <button class="btn btn-secondary" data-action="close">Let me look again</button>
                <button class="btn btn-primary" data-action="lock">Yes, lock it in</button>
            </footer>
        </div>
    </div>

    <script src="../../assets/js/function.js"></script>
    <script src="../js/journey-header.js"></script>
    <script src="../js/character-selection.js"></script>
</body>

</html>
