<!DOCTYPE html>
<html lang="en" data-theme="dark" data-surface="admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sections page (simulation)</title>
    <script src="/assets/js/vendor/supabase.js"></script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages/admin.css">
    <link rel="stylesheet" href="../../styles/pages/admin-console.css">
</head>
<body>
    <!-- SIMULATION ONLY: the Sections view and the Add students dialog in the console's own styles. -->
    <main class="main" style="padding:24px 16px;max-width:1000px;margin:0 auto">
        <section class="page" id="view-sections" data-view-panel="sections">
            <div class="page-head"><h1 class="page-title">Sections</h1>
                <div class="page-actions"><button type="button" class="btn btn-primary" id="sections-add" data-modal-open="modal-add-students">Add students</button></div></div>
            <div class="stack-lg" id="sections-root"></div>
        </section>
    </main>
    <script src="../../assets/js/function.js"></script>
    <script>window.PIAAdmin = { refreshAll: function () {}, toastOk: function (a, b) { document.title = a + ' ' + b; } };</script>
    <script src="../../admin/js/sections.js"></script>
    <script src="../../admin/js/add-students.js"></script>
    <script>
        (function () {
            var overlay = document.getElementById('modal-add-students');
            document.getElementById('as-section').innerHTML = '<option value="">Choose a section</option><option value="7-A">7-A</option><option value="7-B">7-B</option><option value="7-C">7-C</option>';
            document.getElementById('sections-add').addEventListener('click', function () { overlay.classList.add('is-mounted', 'is-open'); });
            overlay.addEventListener('click', function (e) { if (e.target.closest('[data-modal-close]')) { overlay.classList.remove('is-open', 'is-mounted'); } });
            window.addEventListener('load', function () { window.PIASections.show(); });
        })();
    </script>
</body>
</html>
