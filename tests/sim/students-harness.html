<!DOCTYPE html>
<html lang="en" data-theme="dark" data-surface="admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students page tools (simulation)</title>
    <script src="/assets/js/vendor/supabase.js"></script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages/admin.css">
    <link rel="stylesheet" href="../../styles/pages/admin-console.css">
</head>
<body>
    <!-- SIMULATION ONLY: the parts of the Students page that students-tools.js touches, in the console's own
         styles. The console draws the table and then calls the hook; a few lines here do the same. -->
    <main class="main" style="padding:24px 16px;max-width:1100px;margin:0 auto">
        <section class="page" id="view-students" data-view-panel="students">
            <div class="page-head"><h1 class="page-title">Students</h1>
                <div class="page-actions"><button type="button" class="btn btn-primary" id="open-add" data-modal-open="modal-add-students">Add students</button></div></div>
            <div id="section-chips" style="margin-bottom:12px"></div>
            <div id="attendance-bar" style="margin-bottom:16px"></div>
            <div class="panel">
                <div class="filter-row"><div class="filter-field" style="display:none"><label class="filter-label">Section</label>
                    <select class="input input-sm" id="section-filter"><option value="">All sections</option><option value="7-A">7-A</option><option value="7-B">7-B</option><option value="7-C">7-C</option></select></div></div>
                <div class="table-wrap"><table class="table">
                    <thead id="roster-thead"><tr><th scope="col">Student</th><th scope="col">Section</th></tr></thead>
                    <tbody id="student-tbody"></tbody>
                </table></div>
            </div>
            <p class="scope-line" id="opened-profile"></p>
        </section>
    </main>
    <script src="../../assets/js/function.js"></script>
    <script>window.PIAAdmin = { refreshAll: function () { renderRoster(); }, toastOk: function (a, b) { document.title = a + ' ' + b; } };</script>
    <script src="../../admin/js/students-tools.js"></script>
    <script src="../../admin/js/add-students.js"></script>
    <script>
        var ROWS = [
            ['juan@student.test', 'Dela Cruz, Juan P.', '7-A'], ['maria@student.test', 'Santos, Maria C.', '7-A'],
            ['ana@student.test', 'Reyes, Ana', '7-A'], ['pedro@student.test', 'Garcia, Pedro L.', '7-A'],
            ['luis@student.test', 'Bautista, Luis M.', '7-B'], ['rica@student.test', 'Mendoza, Rica', '7-B'],
            ['ella@student.test', 'Navarro, Ella S.', '7-C']
        ];
        function renderRoster() {
            var section = document.getElementById('section-filter').value;
            document.getElementById('student-tbody').innerHTML = ROWS.filter(function (r) { return !section || r[2] === section; }).map(function (r) {
                return '<tr class="is-clickable" tabindex="0" data-student="' + r[0] + '"><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>';
            }).join('');
            if (window.PIACheckin) { window.PIACheckin.decorateRoster(); }
        }
        document.getElementById('student-tbody').addEventListener('click', function (e) {
            var row = e.target.closest('[data-student]'); if (row) { document.getElementById('opened-profile').textContent = 'PROFILE OPENED: ' + row.getAttribute('data-student'); }
        });
        document.getElementById('section-filter').addEventListener('change', renderRoster);   /* the console's own handler does this */
        (function () {
            var overlay = document.getElementById('modal-add-students');
            document.getElementById('as-section').innerHTML = '<option value="">Choose a section</option><option value="7-A">7-A</option><option value="7-B">7-B</option><option value="7-C">7-C</option>';
            document.getElementById('open-add').addEventListener('click', function () { overlay.classList.add('is-mounted', 'is-open'); });
            overlay.addEventListener('click', function (e) { if (e.target.closest('[data-modal-close]')) { overlay.classList.remove('is-open', 'is-mounted'); } });
        })();
        window.addEventListener('load', renderRoster);
    </script>
</body>
</html>
