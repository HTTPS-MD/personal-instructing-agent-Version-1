<!DOCTYPE html>
<html lang="en" data-theme="dark" data-surface="admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add students dialog (simulation)</title>
    <script src="/assets/js/vendor/supabase.js"></script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages/admin.css">
    <link rel="stylesheet" href="../../styles/pages/admin-console.css">
</head>
<body>
    <!-- SIMULATION ONLY: the Add students dialog in the console's own styles. The console normally opens
         and closes dialogs itself; here a few lines do it, and window.PIAAdmin is a stand-in for the
         three things the console lends the dialog. -->
    <main class="main" style="padding:24px 16px">
        <h1 class="page-title">Students</h1>
        <button type="button" class="btn btn-primary" id="open-add" data-modal-open="modal-add-students">Add students</button>
        <select class="input input-sm" id="section-filter"><option value="">All sections</option><option value="7-A">7-A</option></select>
        <p class="scope-line" id="log"></p>
    </main>
    <script src="../../assets/js/function.js"></script>
    <script>
        window.PIAAdmin = {
            enrollOne: async function (s) {
                if (s.email.indexOf('99999999990') === 0) { return { status: 'auth_error' }; }
                var res = await sb.rpc('sim_add_student', { email: s.email, fullName: s.fullName, section: s.section });
                return res.data;
            },
            refreshAll: function () { document.getElementById('log').textContent += ' [refreshAll]'; },
            toastOk: function (a, b) { document.getElementById('log').textContent += ' [toast: ' + a + ' ' + b + ']'; }
        };
    </script>
    <script src="../../admin/js/add-students.js"></script>
    <script>
        (function () {
            var overlay = document.getElementById('modal-add-students');
            var sel = document.getElementById('as-section');
            sel.innerHTML = '<option value="">Choose a section</option><option value="7-A">7-A</option><option value="7-B">7-B</option>';
            document.getElementById('open-add').addEventListener('click', function () { overlay.classList.add('is-mounted', 'is-open'); });
            overlay.addEventListener('click', function (e) { if (e.target.closest('[data-modal-close]')) { overlay.classList.remove('is-open', 'is-mounted'); } });
        })();
    </script>
</body>
</html>
