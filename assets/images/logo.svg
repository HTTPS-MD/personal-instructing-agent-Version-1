<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="pia-logo-title">
  <!-- PIA site logo. Replace this file (or point the <img> tags at another
       one) to rebrand every header at once; CSS caps its height with
       the logo-h token in global.css, so any size or aspect ratio fits.
       The letters are drawn as shapes, not text: an <img> cannot load the
       site's webfonts, so text here would fall back to a system face.
       A violet tile with ink letters reads on both the dark and the light
       theme, so one file serves both. -->
  <title id="pia-logo-title">PIA</title>
  <rect width="48" height="48" fill="#A259FF"/>
  <g fill="#0E0B16" fill-rule="evenodd">
    <path d="M7 16h6a5 5 0 0 1 0 10h-2v6H7Z M11 19.6v2.8h2a1.4 1.4 0 0 0 0-2.8Z"/>
    <path d="M21 16h4v16h-4Z"/>
    <path d="M28 32l5.2-16h2.6L41 32h-4.1l-1-3.4h-3.8l-1 3.4Z M33.3 25h2.4l-1.2-3.7Z"/>
  </g>
  <path d="M40.5 3.5c.3 2.6 1.1 4 4 4.5-2.9.5-3.7 1.9-4 4.5-.3-2.6-1.1-4-4-4.5 2.9-.5 3.7-1.9 4-4.5Z" fill="#D4FF3A" stroke="#0E0B16" stroke-width=".8" stroke-linejoin="round"/>
</svg>
