<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="../../styles/tokens.css">
    <link rel="stylesheet" href="../../styles/base.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="../../styles/pages/error.css">
</head>

<body class="error-page-body">

    <div class="solid-card card-padded-lg error-card">
        <div class="error-code-block">
            <span class="error-code">404</span>
            <span class="badge badge-pill badge-danger">Error / Not Found</span>
        </div>

        <div class="error-message-block">
            <h1 class="error-title">Page Not Found</h1>
            <p class="text-secondary error-desc">
                The page you are looking for might have been removed, had its name changed, or is temporarily
                unavailable.
            </p>
        </div>

        <div class="error-actions">
            <a href="/" class="btn btn-primary btn-block">Back to Home</a>
            <button onclick="history.back()" class="btn btn-secondary btn-block">Go Back</button>
        </div>
    </div>

</body>

</html>
