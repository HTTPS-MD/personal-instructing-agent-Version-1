<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex">
    <title>Set Your Password — PIA</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/pages/auth.css">
</head>

<body>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
            <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.2 2.8 20h18.4L12 4.2Z"/><path d="M12 10.5v3.8"/><circle cx="12" cy="17.2" r=".9" fill="currentColor" stroke="none"/></symbol>
            <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.6 7.2 8.4 5.8 8.4-5.8"/></symbol>
            <symbol id="i-key" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10.2" rx="2.5"/><path d="M7.8 10V7.6a4.2 4.2 0 0 1 8.4 0V10"/><circle cx="12" cy="15.2" r="1.2" fill="currentColor" stroke="none"/></symbol>
        </defs>
    </svg>

    <div class="auth-page">
        <div class="auth-ambient" aria-hidden="true"></div>

        <div class="auth-brand">
            <span class="auth-mark" aria-hidden="true">PIA</span>
            <span class="auth-brand-text">PIA System</span>
        </div>

        <main class="auth-card">
            <!-- Filled by authentication.js from the profile; reserved height
                 so the heading does not shift when the name arrives. -->
            <p class="auth-greeting" id="setup-greeting"></p>
            <h1 class="auth-title">Set your password</h1>
            <p class="auth-lede">
                Pick a password you'll remember. You'll use it with your school email
                every time you sign in.
            </p>

            <div class="auth-identity">
                <svg class="icon"><use href="#i-mail"></use></svg>
                <div class="auth-identity-text">
                    <p class="auth-identity-label">Setting up</p>
                    <p class="auth-identity-value" id="setup-email">—</p>
                </div>
            </div>


            <form class="auth-form" id="setup-password-form" novalidate>
                <div class="field">
                    <label class="label" for="setup-password">New password</label>
                    <input class="input" type="password" id="setup-password" minlength="6"
                        autocomplete="new-password" placeholder="At least 6 characters">
                </div>

                <div class="field">
                    <label class="label" for="setup-confirm-password">Confirm password</label>
                    <input class="input" type="password" id="setup-confirm-password" minlength="6"
                        autocomplete="new-password" placeholder="Type it once more">
                </div>

                <label class="auth-show-row">
                    <input type="checkbox" id="setup-show-password">
                    <span class="auth-show-box"><svg class="icon"><use href="#i-check"></use></svg></span>
                    <span class="auth-show-text">Show my password</span>
                </label>

                <button class="btn btn-primary auth-submit" type="submit" id="setup-submit-btn">
                    <svg class="icon"><use href="#i-key"></use></svg>
                    Activate my account
                </button>
            </form>
            <!-- Permanent, fixed-height status row. -->
            <p class="auth-status hidden" id="setup-status-box" role="status">
                <svg class="icon"><use href="#i-alert"></use></svg>
                <span></span>
            </p>

            <p class="auth-hint">
                Link stopped working? Ask for a new one from the
                <a href="../../index.html">sign-in page</a>.
            </p>
        </main>
    </div>

    <script src="../js/function.js"></script>
    <script src="../js/authentication.js"></script>
</body>

</html>
